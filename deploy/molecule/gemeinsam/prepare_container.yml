# Docker im Testcontainer: vfs-Speichertreiber (overlay2 geht in overlay nicht).
- name: Testsystem für Docker vorbereiten
  hosts: all
  become: true
  tasks:
    - name: Verzeichnis für Docker-Konfiguration
      ansible.builtin.file:
        path: /etc/docker
        state: directory
        mode: "0755"

    - name: Docker-Konfiguration
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        content: '{"storage-driver": "vfs"}'
        mode: "0644"
