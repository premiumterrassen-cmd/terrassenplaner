- name: Docker und Compose installieren
  ansible.builtin.apt:
    name: [docker.io, docker-compose]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Docker starten
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started

- name: Verzeichnisse
  ansible.builtin.file:
    path: "{{ container_verzeichnis }}/{{ item }}"
    state: directory
    mode: "0755"
  loop: [auth_server, server, web, traefik]

- name: Programme und Web-App ausliefern (Linux-Bündel aus der Build-Chain)
  ansible.builtin.copy:
    src: "{{ planer_artefakte_lokal }}/{{ item }}/"
    dest: "{{ container_verzeichnis }}/{{ item }}/"
    mode: "0755"
  loop: [auth_server, server, web]
  notify: Container neu bauen und starten

- name: Dockerfile für die Dart-Dienste
  ansible.builtin.template:
    src: Dockerfile.dienst.j2
    dest: "{{ container_verzeichnis }}/Dockerfile.dienst"
    mode: "0644"
  notify: Container neu bauen und starten

- name: Nginx-Konfiguration der Web-App
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: "{{ container_verzeichnis }}/web.conf"
    mode: "0644"
  notify: Container neu bauen und starten

- name: Umgebung der Dienste (enthält Geheimnisse, nur root lesbar)
  ansible.builtin.template:
    src: geheim.env.j2
    dest: "{{ container_verzeichnis }}/geheim.env"
    mode: "0600"
  no_log: true
  notify: Container neu bauen und starten

- name: Monitoring-Verzeichnisse
  ansible.builtin.file:
    path: "{{ container_verzeichnis }}/monitoring/{{ item }}"
    state: directory
    mode: "0755"
  loop: [grafana/datasources, grafana/dashboards-provider, dashboards]

- name: Prometheus-Konfiguration (Container)
  ansible.builtin.template:
    src: prometheus-container.yml.j2
    dest: "{{ container_verzeichnis }}/monitoring/prometheus.yml"
    mode: "0644"
  notify: Container neu bauen und starten

- name: Grafana-Datenquelle und Dashboards
  ansible.builtin.copy:
    src: "{{ item.quelle }}"
    dest: "{{ container_verzeichnis }}/monitoring/{{ item.ziel }}"
    mode: "0644"
  loop:
    - {quelle: "{{ playbook_dir }}/../roles/monitoring/files/dashboards/", ziel: dashboards/}
  notify: Container neu bauen und starten

- name: Grafana-Provisioning (Container)
  ansible.builtin.copy:
    dest: "{{ container_verzeichnis }}/monitoring/grafana/{{ item.datei }}"
    content: "{{ item.inhalt }}"
    mode: "0644"
  loop:
    - datei: datasources/prometheus.yml
      inhalt: |
        apiVersion: 1
        datasources:
          - {name: Prometheus, uid: prometheus, type: prometheus, access: proxy, url: "http://prometheus:9090", isDefault: true, editable: false}
    - datei: dashboards-provider/terrassenplaner.yml
      inhalt: |
        apiVersion: 1
        providers:
          - {name: Terrassenplaner, folder: Terrassenplaner, type: file, allowUiUpdates: false, options: {path: /var/lib/grafana/dashboards-terrassenplaner}}
  loop_control:
    label: "{{ item.datei }}"
  notify: Container neu bauen und starten

- name: Grafana-Geheimnis (nur root lesbar)
  ansible.builtin.copy:
    dest: "{{ container_verzeichnis }}/grafana.env"
    content: "GF_SECURITY_ADMIN_PASSWORD={{ planer_grafana_admin_passwort }}\n"
    mode: "0600"
  no_log: true
  notify: Container neu bauen und starten

- name: Compose-Datei
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ container_verzeichnis }}/compose.yml"
    mode: "0644"
  notify: Container neu bauen und starten

- name: Container starten
  ansible.builtin.command:
    cmd: docker compose -f compose.yml up -d --build
    chdir: "{{ container_verzeichnis }}"
  register: container_start
  changed_when: "'Started' in container_start.stderr or 'Created' in container_start.stderr or 'Recreated' in container_start.stderr"

- name: Ausstehende Neustarts jetzt ausführen
  ansible.builtin.meta: flush_handlers

- name: Dienste sind gesund
  ansible.builtin.command:
    cmd: docker compose -f compose.yml ps --format json
    chdir: "{{ container_verzeichnis }}"
  register: container_status
  changed_when: false
  until: >-
    (container_status.stdout_lines | map('from_json') | selectattr('Health')
     | rejectattr('Health', 'equalto', 'healthy') | list | length) == 0
  retries: 30
  delay: 3
