# Gemeinsame Werte aller Planer-Rollen (Ports, Pfade, Benutzer).
planer_betriebsart: systemd
planer_basis: /opt/terrassenplaner
planer_daten: /var/lib/terrassenplaner
planer_artefakte_lokal: "{{ playbook_dir }}/../../artefakte"

planer_router_port: 8080
planer_router_health: 127.0.0.1:8081
planer_auth_listen: 127.0.0.1:8082
planer_auth_health: 127.0.0.1:8083
planer_datenbank_metriken: 127.0.0.1:8084
# Datenbank-Kennzahlen des Routers (Konfigurationen, M10-03)
planer_router_datenbank_metriken: 127.0.0.1:8085
# Ablage der Sicherungskopie je Dienst (SIGUSR1, M10-03) und Textdateien des Node-Exporters
planer_sicherung_unterordner: sicherung
planer_textdatei_metriken: /var/lib/prometheus/node-exporter
planer_web_port: 8090
planer_ws_pfad: /ws
planer_realm: de.robinienwelt.terrassenplaner

planer_router_benutzer: planer-router
planer_auth_benutzer: planer-auth

planer_letsencrypt_ca: production
planer_letsencrypt_ca_urls:
  production: https://acme-v02.api.letsencrypt.org/directory
  staging: https://acme-staging-v02.api.letsencrypt.org/directory

# Grafana-Anmeldung (Passwort aus Ansible Vault)
planer_grafana_admin: admin

# Umstellung vom alten Planer (M10-04): alte Adressen leiten dauerhaft (301/308) auf
# https://<planer_domain>/ um – Pfad und Abfrage entfallen. Leer = keine Umleitung aktiv.
# Einen Host erst eintragen, wenn sein DNS auf den Server zeigt (Let's-Encrypt-Prüfung
# über HTTP), siehe docs/betrieb/umstellung.md.
planer_alte_hosts: []
