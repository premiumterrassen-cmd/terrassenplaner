- name: SQLite für konsistente Kopien
  ansible.builtin.apt:
    name: sqlite3
    state: present

- name: Sicherungsverzeichnis (nur root)
  ansible.builtin.file:
    path: "{{ sicherung_verzeichnis }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Sicherungs- und Wiederherstellungsskript
  ansible.builtin.template:
    src: "{{ item }}.sh.j2"
    dest: "/usr/local/sbin/{{ item }}"
    mode: "0755"
  loop: [planer-sicherung, planer-wiederherstellung]

- name: Sicherungsdienst und Timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop: [planer-sicherung.service, planer-sicherung.timer]
  notify: Sicherungs-Timer neu laden

- name: Timer aktiv
  ansible.builtin.systemd_service:
    name: planer-sicherung.timer
    enabled: true
    state: started
    daemon_reload: true

# Erste Sicherung gleich beim Ausrollen: Ohne sie meldet der Alarm
# „Sicherung veraltet“ bis zum ersten nächtlichen Lauf fehlende Daten.
- name: Bisherige Sicherungsmeldungen
  ansible.builtin.find:
    paths: "{{ planer_textdatei_metriken }}"
    patterns: "planer_sicherung_*.prom"
  register: sicherung_meldungen

- name: Erste Sicherung ausführen
  ansible.builtin.systemd_service:
    name: planer-sicherung.service
    state: started
  when: (sicherung_meldungen.files | length) < (sicherung_objectbox | length) + 1
