- name: Systembenutzer je Dienst
  ansible.builtin.user:
    name: "{{ item.benutzer }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ planer_daten }}/{{ item.name }}"
    create_home: true
  loop: "{{ planer_dienste_liste }}"
  loop_control:
    label: "{{ item.name }}"

- name: Programmverzeichnisse
  ansible.builtin.file:
    path: "{{ planer_basis }}/{{ item.programm }}"
    state: directory
    mode: "0755"
  loop: "{{ planer_dienste_liste }}"
  loop_control:
    label: "{{ item.name }}"

- name: Programme ausliefern (Linux-Bündel aus der Build-Chain)
  ansible.builtin.copy:
    src: "{{ planer_artefakte_lokal }}/{{ item.programm }}/"
    dest: "{{ planer_basis }}/{{ item.programm }}/"
    mode: preserve
  loop: "{{ planer_dienste_liste }}"
  loop_control:
    label: "{{ item.name }}"
  notify: Planer-Dienste neu starten

- name: Programme ausführbar
  ansible.builtin.file:
    path: "{{ planer_basis }}/{{ item.programm }}/bin/{{ item.programm }}"
    mode: "0755"
  loop: "{{ planer_dienste_liste }}"
  loop_control:
    label: "{{ item.name }}"

- name: Konfigurationsverzeichnis
  ansible.builtin.file:
    path: /etc/terrassenplaner
    state: directory
    mode: "0700"

- name: Umgebung je Dienst (enthält Geheimnisse, nur root lesbar)
  ansible.builtin.template:
    src: "{{ item.name }}.env.j2"
    dest: "/etc/terrassenplaner/{{ item.name }}.env"
    mode: "0600"
  loop: "{{ planer_dienste_liste }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true
  notify: Planer-Dienste neu starten

- name: Systemd-Units
  ansible.builtin.template:
    src: dienst.service.j2
    dest: "/etc/systemd/system/{{ item.name }}.service"
    mode: "0644"
  loop: "{{ planer_dienste_liste }}"
  loop_control:
    label: "{{ item.name }}"
  notify: Planer-Dienste neu starten

- name: Dienste starten
  ansible.builtin.systemd_service:
    name: "{{ item.name }}"
    enabled: true
    state: started
    daemon_reload: true
  loop: "{{ planer_dienste_liste }}"
  loop_control:
    label: "{{ item.name }}"

- name: Ausstehende Neustarts jetzt ausführen
  ansible.builtin.meta: flush_handlers

- name: Health-Endpunkte melden Bereitschaft
  ansible.builtin.uri:
    url: "http://{{ item.health }}/healthz"
    status_code: 200
  register: planer_dienste_health
  until: planer_dienste_health.status == 200
  retries: 30
  delay: 2
  loop: "{{ planer_dienste_liste }}"
  loop_control:
    label: "{{ item.name }}"
