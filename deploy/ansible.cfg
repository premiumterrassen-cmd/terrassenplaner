[defaults]
inventory = inventories/produktion/hosts.yml
roles_path = roles
stdout_callback = default
result_format = yaml
retry_files_enabled = False
interpreter_python = auto_silent
# Vault-Passwort liegt nur lokal bei Alexander (chmod 600), nie im Repository.
vault_password_file = ~/.ansible/vault-terrassenplaner

[ssh_connection]
pipelining = True
