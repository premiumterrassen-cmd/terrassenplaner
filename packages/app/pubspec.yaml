name: terrassenplaner_app
description: Oberfläche des Terrassenplaners (Flutter Web).
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.5

dependencies:
  connectanum_client: 3.0.0-beta.8
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  terrassenplaner_domain: ^0.1.0
  url_launcher: ^6.3.3
  web: ^1.1.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  plugin_platform_interface: ^2.1.8
  terrassenplaner_server: ^0.1.0
  url_launcher_platform_interface: ^2.3.2

flutter:
  uses-material-design: true
  # Übersetzungen aus lib/l10n/*.arb (M3-07).
  generate: true
  assets:
    - assets/bilder/
  # Eigene Schrift statt Abruf von Google-Servern (M3-01, Datenschutz).
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/schriften/Roboto-Regular.ttf
        - asset: assets/schriften/Roboto-Medium.ttf
          weight: 500
        - asset: assets/schriften/Roboto-Bold.ttf
          weight: 700
