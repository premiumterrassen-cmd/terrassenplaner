<!DOCTYPE html>
<html lang="de">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Terrassenplaner von ALTO HOLZ">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Terrassenplaner">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Terrassenplaner – ALTO HOLZ</title>
  <link rel="stylesheet" href="ladebild/ladebild.css">
</head>
<body>
  <!-- Ladebildschirm (M3-08): sichtbar, bevor Flutter lädt; Gestaltung wie der bisherige Planer. -->
  <div id="ladebild" role="status" aria-live="polite">
    <div class="ladebild-ringe" aria-hidden="true"></div>
    <img class="ladebild-logo" src="ladebild/robinienwelt-logo.svg" alt="RobinienWelt – natürlich gut">
    <div class="ladebild-karte">
      <p id="ladebild-titel" class="ladebild-titel">Ihr Terrassenplaner wird geladen</p>
      <div id="ladebild-balken" class="ladebild-balken" role="progressbar" aria-label="Ladefortschritt" aria-valuemin="0" aria-valuemax="100">
        <div id="ladebild-fuellung" class="ladebild-fuellung"></div>
      </div>
      <p id="ladebild-prozent" class="ladebild-prozent"></p>
      <p id="ladebild-status" class="ladebild-status"></p>
      <button id="ladebild-erneut" class="ladebild-erneut" type="button" hidden>Erneut versuchen</button>
    </div>
  </div>
  <!-- Größen der Startdateien – wird beim Build von tool/startgroessen.py gefüllt. -->
  <script id="startgroessen" type="application/json">{}</script>
  <script src="ladebild/fortschritt.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
