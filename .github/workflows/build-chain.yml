# Build-Chain des Terrassenplaners (M0-06): läuft bei jedem Push und jedem Pull Request.
name: Build-Chain

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-chain-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.6"

jobs:
  analyse:
    name: Format und Analyse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos

  unit-tests:
    name: Unit-Tests mit Abdeckung (100 %)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: tool/coverage.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: abdeckung
          path: coverage/
          if-no-files-found: ignore

  mutation-tests:
    name: Mutation-Tests (≥ 95 %)
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: tool/mutation.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-tests
          path: mutation-test-report/
          if-no-files-found: ignore

  smoke-tests:
    name: Frontend-Smoke-Tests (headless Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
          install-chromedriver: true
      - run: flutter pub get
      - name: Smoke-Tests
        env:
          CHROME_EXECUTABLE: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          export PATH="$(dirname '${{ steps.chrome.outputs.chromedriver-path }}'):$PATH"
          tool/smoke.sh

  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    env:
      BENCH_ENV: ci
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: tool/benchmark.sh
      - uses: actions/upload-artifact@v7
        with:
          name: benchmarks
          path: benchmark-results/

  build:
    name: Build Web-App und Server
    needs: [analyse, unit-tests, mutation-tests, smoke-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Web-App bauen
        working-directory: packages/app
        run: |
          flutter build web --release --wasm
          python3 ../../tool/startgroessen.py build/web
      - name: Router und Auth-Server bauen (Linux-Bündel)
        working-directory: packages/server
        run: |
          dart build cli --target=bin/server.dart --output=build/server
          dart build cli --target=bin/auth_server.dart --output=build/auth_server
      - name: Artefakte zusammenstellen
        run: |
          mkdir -p artefakte
          cp -r packages/server/build/server/bundle artefakte/server
          cp -r packages/server/build/auth_server/bundle artefakte/auth_server
          cp -r packages/app/build/web artefakte/web
      - uses: actions/upload-artifact@v7
        with:
          name: planer-artefakte
          path: artefakte/

  ansible-lint:
    name: Ansible-Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r deploy/requirements-test.txt
      - name: ansible-lint (Profil production)
        working-directory: deploy
        env:
          # Ohne Produktions-Inventar und Vault-Passwort (ansible-pruefung.cfg).
          ANSIBLE_CONFIG: ansible-pruefung.cfg
        run: ansible-lint --profile production

  ansible-molecule:
    name: Ansible-Molecule (${{ matrix.szenario }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        szenario: [systemd, container]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: planer-artefakte
          path: artefakte
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r deploy/requirements-test.txt && ansible-galaxy collection install community.docker
      - name: molecule test
        working-directory: deploy
        env:
          PLANER_ARTEFAKTE: ${{ github.workspace }}/artefakte
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
        run: molecule test -s ${{ matrix.szenario }}
